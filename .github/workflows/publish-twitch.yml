name: Publish Orbit Twitch audio-video synchronization 1.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-twitch.yml'
permissions:
  contents: write
concurrency:
  group: orbit-shared-pages-2026101703
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and audit exact tested public files
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Lumia1193/orbit-releases/$GITHUB_SHA/.github/workflows/release-payload.txt" --output release-payload.txt
          python3 - <<'PY'
          import base64,gzip,hashlib,json,urllib.request,zipfile
          p=json.loads(gzip.decompress(base64.b64decode(open('release-payload.txt').read())))
          bases=[]
          for row in p['bases']:
              data=urllib.request.urlopen(row['url']).read()
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              bases.append(data)
          for row in p['modules']:
              data=b''.join(base64.b64decode(r['literal']) if 'literal' in r else bases[r['base']][r['offset']:r['offset']+r['length']] for r in row['recipe'])
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              open(row['name'],'wb').write(data)
          for row in p['files']:
              data=base64.b64decode(row['data'])
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              open(row['name'],'wb').write(data)
          for name in ['Orbit-1.0.zip','trackr-1.0.module.zip','apple-music-1.0.module.zip','twitch-1.0.module.zip']:
              with zipfile.ZipFile(name) as z:
                  assert all(not f.lower().endswith(('.icue','.icuewidget','.zip')) for f in z.namelist())
                  assert all(not any(secret in f for secret in ['account.dpapi','pairing.json','widget-preferences.json','player-profile','publisher-private']) for f in z.namelist())
          print('Verified exact tested software, three modules and signed catalogs; no widget exports or private accounts.')
          PY
      - name: Publish Orbit and three modules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view build-2026101703 --repo "$GH_REPO" >/dev/null 2>&1; then exit 1; fi
          gh release create build-2026101703 Orbit-1.0.zip trackr-1.0.module.zip apple-music-1.0.module.zip twitch-1.0.module.zip orbit-catalog-v2.json orbit-catalog.json --repo "$GH_REPO" --latest --title 'Orbit 1.0' --notes 'Twitch audio/video synchronization: the official player tab now sends its own audio and video together in one WebRTC MediaStream. Direct playback from the source tab is explicitly suppressed to prevent duplicate audio. No microphone or system-audio capture. Volume, page pause, explicit resume, update recovery and iCUE preview blocking retained. Synchronization diagnostic translated into nine languages. Tested with synthetic audiovisual signals, strict autoplay policy and XL/L/M/S; physical Xeneon listening remains to be confirmed. Apple Music and TRACKR packages retained byte-for-byte. Public version remains 1.0. No personal accounts, browser profiles, credentials, private email or iCUE exports included.'
