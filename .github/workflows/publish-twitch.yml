name: Publish Orbit Twitch module 1.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-twitch.yml'
permissions:
  contents: write
concurrency:
  group: orbit-twitch-release-2026101607
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare and audit exact tested release files
        run: |
          curl --fail --location --retry 3 'https://github.com/Lumia1193/trackr-releases/releases/download/module-build-2026101403/trackr-1.0.module.zip' --output base.zip
          python3 - <<'PY'
          import base64,gzip,hashlib,json,zipfile
          base=open('base.zip','rb').read()
          assert hashlib.sha256(base).hexdigest()=='f742e1dfaf62a5faea50b881e129092b807893a537bbf928654a36c1fe1d8d1c'
          recipe=json.loads(gzip.decompress(base64.b64decode('')))
          module=b''.join(base64.b64decode(p['literal']) if 'literal' in p else base[p['offset']:p['offset']+p['length']] for p in recipe)
          assert hashlib.sha256(module).hexdigest()=='6ad677a7b71055f550d6084bff1815897e208a0b7a40c30d1cb95e52c46a1c9e'
          open('twitch-1.0.module.zip','wb').write(module)
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for name,item in files.items():
              data=base64.b64decode(item['data'])
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              open(name,'wb').write(data)
          for name in ['Orbit-1.0.zip','twitch-1.0.module.zip']:
              with zipfile.ZipFile(name) as package:
                  assert all(not entry.lower().endswith(('.icue','.icuewidget','.zip')) for entry in package.namelist())
                  assert all('account.dpapi' not in entry and 'player-profile' not in entry for entry in package.namelist())
                  if name=='Orbit-1.0.zip':
                      assert set(package.namelist())=={'Orbit-1.0/Companion.exe','Orbit-1.0/OrbitUpdater.exe','Orbit-1.0/LIRE-MOI.md'}
                  else:
                      assert all(entry.startswith('program/') and not entry.endswith('manifest.json') and not entry.endswith('OrbitTwitch.exe') for entry in package.namelist())
          print('Verified exact tested Orbit and Twitch module, signed catalogs; no widget export or private account files.')
          PY
      - name: Publish Orbit 1.0 and its Twitch module
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view build-2026101607 --repo "$GH_REPO" >/dev/null 2>&1; then echo 'Release already exists; existing assets will not be overwritten.'; exit 1; fi
          gh release create build-2026101607 Orbit-1.0.zip twitch-1.0.module.zip orbit-catalog-v2.json orbit-catalog.json --repo "$GH_REPO" --latest --title 'Orbit 1.0' --notes 'Dedicated four-size Twitch layouts: XL and L are preserved; M places video above chat, S uses a larger video beside compact chat. Small layouts use an on-demand channel drawer instead of a permanent sidebar, with accessible controls and live resizing without restarting playback. Empty username colors are now resolved by the module as well as the interface, including for already-open older chat pages. The fallback palette contains no violet; explicit Twitch username colors remain unchanged. Recent-chatter @ suggestions remain included, with improved selection contrast. Poll display is not included: Twitch requires broadcaster authorization to retrieve channel polls. All-module uninstall with preserved data and the simplified one-widget linking window remain included. Explicit module activation/deactivation remains respected. Live streams, replays, chat and existing account/preferences paths preserved. Chrome or Edge required. Existing TRACKR and Apple Music module files are unchanged. Nine interface languages. No .icue/.icuewidget files, exported widget, private accounts or browser profiles included. Public version remains 1.0.'
