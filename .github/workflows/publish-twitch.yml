name: Publish Orbit Twitch stop on iCUE exit 1.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-twitch.yml'
permissions:
  contents: write
concurrency:
  group: orbit-shared-pages-2026101704
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and audit exact tested public files
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Lumia1193/orbit-releases/$GITHUB_SHA/.github/workflows/release-payload.txt" --output release-payload.txt
          python3 - <<'PY'
          import base64,gzip,hashlib,json,urllib.request,zipfile
          p=json.loads(gzip.decompress(base64.b64decode(open('release-payload.txt').read())))
          bases=[]
          for row in p['bases']:
              data=urllib.request.urlopen(row['url']).read()
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              bases.append(data)
          for row in p['modules']:
              data=b''.join(base64.b64decode(r['literal']) if 'literal' in r else bases[r['base']][r['offset']:r['offset']+r['length']] for r in row['recipe'])
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              open(row['name'],'wb').write(data)
          for row in p['files']:
              data=base64.b64decode(row['data'])
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              open(row['name'],'wb').write(data)
          for name in ['Orbit-1.0.zip','trackr-1.0.module.zip','apple-music-1.0.module.zip','twitch-1.0.module.zip']:
              with zipfile.ZipFile(name) as z:
                  assert all(not f.lower().endswith(('.icue','.icuewidget','.zip')) for f in z.namelist())
                  assert all(not any(secret in f for secret in ['account.dpapi','pairing.json','widget-preferences.json','player-profile','publisher-private']) for f in z.namelist())
          print('Verified exact tested software, three modules and signed catalogs; no widget exports or private accounts.')
          PY
      - name: Publish Orbit and three modules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view build-2026101704 --repo "$GH_REPO" >/dev/null 2>&1; then exit 1; fi
          gh release create build-2026101704 Orbit-1.0.zip trackr-1.0.module.zip apple-music-1.0.module.zip twitch-1.0.module.zip orbit-catalog-v2.json orbit-catalog.json --repo "$GH_REPO" --latest --title 'Orbit 1.0' --notes 'Twitch now closes the entire owned stream browser, audio and video, when iCUE exits completely. A native same-Windows-session host monitor reports changes over the private module pipe. New playback is blocked while iCUE is absent; stale widgets and late connection offers cannot resurrect the source. Reopening requires explicit Play. Unknown process observations do not interrupt playback. Minimized or tray-running iCUE is not treated as exited. Audio/video synchronization, volume, page pause, update recovery and preview blocking retained. Tested with fake host probes, actual synthetic WebRTC browser shutdown, late-offer race tests and native isolated install/update/uninstall tests. Accounts and preferences preserved. Apple Music and TRACKR packages unchanged. Public version remains 1.0. No personal accounts, profiles, credentials, private email or iCUE exports included.'
