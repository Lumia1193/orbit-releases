name: Publish Orbit Twitch stereo audio quality 1.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-twitch.yml'
permissions:
  contents: write
concurrency:
  group: orbit-shared-pages-2026101705
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and audit exact tested public files
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Lumia1193/orbit-releases/$GITHUB_SHA/.github/workflows/release-payload.txt" --output release-payload.txt
          python3 - <<'PY'
          import base64,gzip,hashlib,json,urllib.request,zipfile
          p=json.loads(gzip.decompress(base64.b64decode(open('release-payload.txt').read())))
          bases=[]
          for row in p['bases']:
              data=urllib.request.urlopen(row['url']).read()
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              bases.append(data)
          for row in p['modules']:
              data=b''.join(base64.b64decode(r['literal']) if 'literal' in r else bases[r['base']][r['offset']:r['offset']+r['length']] for r in row['recipe'])
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              open(row['name'],'wb').write(data)
          for row in p['files']:
              data=base64.b64decode(row['data'])
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              open(row['name'],'wb').write(data)
          for name in ['Orbit-1.0.zip','trackr-1.0.module.zip','apple-music-1.0.module.zip','twitch-1.0.module.zip']:
              with zipfile.ZipFile(name) as z:
                  assert all(not f.lower().endswith(('.icue','.icuewidget','.zip')) for f in z.namelist())
                  assert all(not any(secret in f for secret in ['account.dpapi','pairing.json','widget-preferences.json','player-profile','publisher-private']) for f in z.namelist())
          print('Verified exact tested software, three modules and signed catalogs; no widget exports or private accounts.')
          PY
      - name: Publish Orbit and three modules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view build-2026101705 --repo "$GH_REPO" >/dev/null 2>&1; then exit 1; fi
          gh release create build-2026101705 Orbit-1.0.zip trackr-1.0.module.zip apple-music-1.0.module.zip twitch-1.0.module.zip orbit-catalog-v2.json orbit-catalog.json --repo "$GH_REPO" --latest --title 'Orbit 1.0' --notes 'Twitch audio quality: explicitly negotiate stereo Opus at 48 kHz with a 256 kbps encoding ceiling, preserve independent left and right channels and request unprocessed music capture without microphone-style noise suppression, gain control or echo cancellation. Stereo separation and a 5 kHz test tone verified through real synthetic tab capture and WebRTC, with a mono baseline reproducing the lost channel separation. The same synchronized audio/video stream, full iCUE exit shutdown, page pause, explicit resume, update recovery and preview blocking are retained. Native account and update tests use isolated fake data. Apple Music and TRACKR packages unchanged. Public version remains 1.0. No personal accounts, private email, browser profiles, credentials or iCUE exports included.'
