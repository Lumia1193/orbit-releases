name: Publish Orbit Twitch module 1.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-twitch.yml'
permissions:
  contents: write
concurrency:
  group: orbit-twitch-release-2026101612
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare and audit exact tested release files
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Lumia1193/orbit-releases/$GITHUB_SHA/.github/workflows/release-payload.txt" --output release-payload.txt
          curl --fail --location --retry 3 'https://github.com/Lumia1193/trackr-releases/releases/download/module-build-2026101403/trackr-1.0.module.zip' --output base.zip
          python3 - <<'PY'
          import base64,gzip,hashlib,json,zipfile
          base=open('base.zip','rb').read()
          assert hashlib.sha256(base).hexdigest()=='f742e1dfaf62a5faea50b881e129092b807893a537bbf928654a36c1fe1d8d1c'
          recipe=json.loads(gzip.decompress(base64.b64decode('')))
          module=b''.join(base64.b64decode(p['literal']) if 'literal' in p else base[p['offset']:p['offset']+p['length']] for p in recipe)
          assert hashlib.sha256(module).hexdigest()=='a6a3f12dd0295ed1a565c699a8de430845a5d0dc49719be9f134e8e36bc2ed5f'
          open('twitch-1.0.module.zip','wb').write(module)
          files=json.loads(gzip.decompress(base64.b64decode(open('release-payload.txt').read())))
          for name,item in files.items():
              data=base64.b64decode(item['data'])
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              open(name,'wb').write(data)
          for name in ['Orbit-1.0.zip','twitch-1.0.module.zip']:
              with zipfile.ZipFile(name) as package:
                  assert all(not entry.lower().endswith(('.icue','.icuewidget','.zip')) for entry in package.namelist())
                  assert all('account.dpapi' not in entry and 'player-profile' not in entry for entry in package.namelist())
                  if name=='Orbit-1.0.zip':
                      assert set(package.namelist())=={'Orbit-1.0/Companion.exe','Orbit-1.0/OrbitUpdater.exe','Orbit-1.0/LIRE-MOI.md'}
                  else:
                      assert all(entry.startswith('program/') and not entry.endswith('manifest.json') and not entry.endswith('OrbitTwitch.exe') for entry in package.namelist())
          print('Verified exact tested Orbit and Twitch module, signed catalogs; no widget export or private account files.')
          PY
      - name: Publish Orbit 1.0 and its Twitch module
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view build-2026101612 --repo "$GH_REPO" >/dev/null 2>&1; then echo 'Release already exists; existing assets will not be overwritten.'; exit 1; fi
          gh release create build-2026101612 Orbit-1.0.zip twitch-1.0.module.zip orbit-catalog-v2.json orbit-catalog.json --repo "$GH_REPO" --latest --title 'Orbit 1.0' --notes 'Twitch widget M and S are now stream-only by default: one 16:9 player, no chat or permanent panels, transparent surroundings in light and dark themes, no ambient duplicate, and a compact 36px floating auto-hiding toolbar. Channel/search/settings remain in an on-demand drawer; resizing back to L or XL restores their existing chat layout without replacing the player. L/XL include a Twitch emote picker before Send, with search and insertion at the text cursor. Global emotes and only the subscriber/follower emotes returned for the connected account are listed. Loading personal emotes requires user:read:emotes; existing accounts keep working and may explicitly grant it from the picker, never automatically. No guest mode. Chat auto-follow is now persistent user intent across background windows, image loading and resizing: deliberate upward scrolling pauses it, reaching the bottom or clicking the arrow resumes it. Existing Orbit Eclipse design, centered transparent Windows icon, taskbar minimize, data-preserving uninstall, optional first-run modules, account/storage paths, and Twitch update recovery remain. Nine interface languages and isolated fake-data/browser/WebRTC tests. Existing TRACKR and Apple Music packs unchanged. Public version remains 1.0. No iCUE exports, private accounts or profiles uploaded.'
