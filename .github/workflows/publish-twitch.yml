name: Publish Orbit Twitch module 1.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-twitch.yml'
permissions:
  contents: write
concurrency:
  group: orbit-twitch-release-2026101611
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare and audit exact tested release files
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Lumia1193/orbit-releases/$GITHUB_SHA/.github/workflows/release-payload.txt" --output release-payload.txt
          curl --fail --location --retry 3 'https://github.com/Lumia1193/trackr-releases/releases/download/module-build-2026101403/trackr-1.0.module.zip' --output base.zip
          python3 - <<'PY'
          import base64,gzip,hashlib,json,zipfile
          base=open('base.zip','rb').read()
          assert hashlib.sha256(base).hexdigest()=='f742e1dfaf62a5faea50b881e129092b807893a537bbf928654a36c1fe1d8d1c'
          recipe=json.loads(gzip.decompress(base64.b64decode('')))
          module=b''.join(base64.b64decode(p['literal']) if 'literal' in p else base[p['offset']:p['offset']+p['length']] for p in recipe)
          assert hashlib.sha256(module).hexdigest()=='afae2e510f1abc85fb819d4105dd125b742b03eecd0b77e846545a728e976560'
          open('twitch-1.0.module.zip','wb').write(module)
          files=json.loads(gzip.decompress(base64.b64decode(open('release-payload.txt').read())))
          for name,item in files.items():
              data=base64.b64decode(item['data'])
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              open(name,'wb').write(data)
          for name in ['Orbit-1.0.zip','twitch-1.0.module.zip']:
              with zipfile.ZipFile(name) as package:
                  assert all(not entry.lower().endswith(('.icue','.icuewidget','.zip')) for entry in package.namelist())
                  assert all('account.dpapi' not in entry and 'player-profile' not in entry for entry in package.namelist())
                  if name=='Orbit-1.0.zip':
                      assert set(package.namelist())=={'Orbit-1.0/Companion.exe','Orbit-1.0/OrbitUpdater.exe','Orbit-1.0/LIRE-MOI.md'}
                  else:
                      assert all(entry.startswith('program/') and not entry.endswith('manifest.json') and not entry.endswith('OrbitTwitch.exe') for entry in package.namelist())
          print('Verified exact tested Orbit and Twitch module, signed catalogs; no widget export or private account files.')
          PY
      - name: Publish Orbit 1.0 and its Twitch module
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view build-2026101611 --repo "$GH_REPO" >/dev/null 2>&1; then echo 'Release already exists; existing assets will not be overwritten.'; exit 1; fi
          gh release create build-2026101611 Orbit-1.0.zip twitch-1.0.module.zip orbit-catalog-v2.json orbit-catalog.json --repo "$GH_REPO" --latest --title 'Orbit 1.0' --notes 'More informative, concise widget descriptions in nine languages for TRACKR, Apple Music and Twitch. Borderless Orbit now exposes the native minimize style used by Windows taskbar clicks; minimize and restore tested without stopping modules. Centered white Orbit mark with gradient orbit and transparent background replaces the white tile in all seven Windows icon sizes. Sidebar version label removed; public version remains 1.0. New Eclipse dark Orbit interface with the geometric Orbit 02 logo in the app and Windows icons. Genuine TRACKR module icon retained. Cyan-to-lilac hover highlights, explicit activation switches and an overflow uninstall menu preserve module data. Fresh installations download or install no modules automatically: each module is chosen with Install. Existing installed and enabled modules are preserved. Cached artwork, parallel local status checks and no redundant card repaints improve responsiveness. Nine-language first-run, hover, layout and existing lifecycle/update tests pass on isolated fake data. Automatic Twitch player recovery after Orbit or module restart: detects replaced/inactive relays and broken WebRTC connections, renegotiates the selected stream with bounded retries, and preserves volume, replay position and explicit pause. Healthy playback and transient probe failures do not trigger unnecessary restarts. Changed selections and Stop cancel pending recovery. Existing authorization remains required; no sign-in or new permissions are triggered. Transparent cinema background for M and S in light and dark themes: removed the reserved header row and white strip, disabled the ambient halo only in compact cinema, and kept readable auto-hiding overlay controls. Video remains fitted at 16:9 without restarting playback on cinema entry/exit. XL and L cinema behavior is unchanged. Dedicated four-size Twitch layouts remain included: M places video above chat, S uses a larger video beside compact chat. Small layouts use an on-demand channel drawer instead of a permanent sidebar, with accessible controls and live resizing without restarting playback. Empty username colors are now resolved by the module as well as the interface, including for already-open older chat pages. The fallback palette contains no violet; explicit Twitch username colors remain unchanged. Recent-chatter @ suggestions remain included, with improved selection contrast. Poll display is not included: Twitch requires broadcaster authorization to retrieve channel polls. All-module uninstall with preserved data and the simplified one-widget linking window remain included. Explicit module activation/deactivation remains respected. Live streams, replays, chat and existing account/preferences paths preserved. Chrome or Edge required. Existing TRACKR and Apple Music module files are unchanged. Nine interface languages. No .icue/.icuewidget files, exported widget, private accounts or browser profiles included. Public version remains 1.0.'
