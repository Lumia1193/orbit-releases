name: Publish Orbit shared widget sessions 1.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-twitch.yml'
permissions:
  contents: write
concurrency:
  group: orbit-shared-pages-2026101701
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and audit exact tested public files
        run: |
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Lumia1193/orbit-releases/$GITHUB_SHA/.github/workflows/release-payload.txt" --output release-payload.txt
          python3 - <<'PY'
          import base64,gzip,hashlib,json,urllib.request,zipfile
          p=json.loads(gzip.decompress(base64.b64decode(open('release-payload.txt').read())))
          bases=[]
          for row in p['bases']:
              data=urllib.request.urlopen(row['url']).read()
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              bases.append(data)
          for row in p['modules']:
              data=b''.join(base64.b64decode(r['literal']) if 'literal' in r else bases[r['base']][r['offset']:r['offset']+r['length']] for r in row['recipe'])
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              open(row['name'],'wb').write(data)
          for row in p['files']:
              data=base64.b64decode(row['data'])
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              open(row['name'],'wb').write(data)
          for name in ['Orbit-1.0.zip','trackr-1.0.module.zip','apple-music-1.0.module.zip','twitch-1.0.module.zip']:
              with zipfile.ZipFile(name) as z:
                  assert all(not f.lower().endswith(('.icue','.icuewidget','.zip')) for f in z.namelist())
                  assert all(not any(secret in f for secret in ['account.dpapi','pairing.json','widget-preferences.json','player-profile','publisher-private']) for f in z.namelist())
          print('Verified exact tested software, three modules and signed catalogs; no widget exports or private accounts.')
          PY
      - name: Publish Orbit and three modules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view build-2026101701 --repo "$GH_REPO" >/dev/null 2>&1; then exit 1; fi
          gh release create build-2026101701 Orbit-1.0.zip trackr-1.0.module.zip apple-music-1.0.module.zip twitch-1.0.module.zip orbit-catalog-v2.json orbit-catalog.json --repo "$GH_REPO" --latest --title 'Orbit 1.0' --notes 'Twitch standby UX: a clear central Start stream or Playback paused - Resume action replaces the unexplained black screen on startup and page return. Clicking the video area uses the existing playback control, with starting feedback and no autoplay. Nine interface languages, XL/L/M/S and transparent compact backgrounds. Existing lifecycle correction retained: iCUE editor preview is blocked using the documented iCUE.isPreview SDK flag, including the local-file launcher. Leaving a page immediately pauses the owned stream and returning does not restart it. Restored selections start in standby until explicit Play. Distinct peer-session IDs prevent stale widgets sharing one cookie from pausing or stopping another page. No duplicate reader or automatic foreground takeover. Source pause, manual resume and blocked previews tested with real synthetic WebRTC on XL/L/M/S. TRACKR and Apple Music module revisions and bytes retained. Shared widget connection and settings across Xeneon pages. Twitch reuses the explicit initial Orbit approval for new isolated iCUE partitions, retains account-bound last playback and shares language, theme, quality, audio and display preferences. TRACKR offers an authenticated same-origin local widget session after previous approval, recovers saved library and preferences, keeps backup-only scope restricted and never redirects a file widget with unpaired local media. Apple Music shares preferences through its existing authenticated relay and keeps account/player state in the Windows app. Orbit refreshes managed Apple widget code with recoverable code backups, without replacing pairing, manifest or iCUE storage. XL/L/M/S browser fixtures use separate contexts and fake accounts; native install/uninstall/update and playback recovery tests remain isolated. Public version stays 1.0. No guest mode, no iCUE exports or private account/profile files on GitHub.'
