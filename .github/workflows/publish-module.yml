name: Publish Orbit integrated settings
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-module.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare verified public files
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,zipfile
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for name,item in files.items():
              data=base64.b64decode(item['data'])
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              open(name,'wb').write(data)
          with zipfile.ZipFile('Orbit-1.0.zip') as package:
              assert set(package.namelist())=={'Orbit-1.0/Companion.exe','Orbit-1.0/OrbitUpdater.exe','Orbit-1.0/LIRE-MOI.md'}
          print('Verified software and signed update catalogs; no widget packages.')
          PY
      - name: Publish version 1.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view build-2026101409 --repo "$GH_REPO" >/dev/null 2>&1; then echo 'Release exists; previous files preserved.'; exit 0; fi
          gh release create build-2026101409 Orbit-1.0.zip orbit-catalog-v2.json orbit-catalog.json --repo "$GH_REPO" --title 'Orbit 1.0' --notes 'Pearl and lavender interface, sharper icons, startup layout fixes, update controls on Modules, nine-language flag selector and TRACKR settings integrated into Orbit. English first-install default. Existing libraries and backups preserved. Apple Music startup fixes retained. No .icue or .icuewidget files. Public version 1.0.'
