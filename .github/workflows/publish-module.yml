name: Publish Orbit update notification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-module.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare verified public files
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,zipfile
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for name,item in files.items():
              data=base64.b64decode(item['data'])
              assert hashlib.sha256(data).hexdigest()==item['sha256']
              open(name,'wb').write(data)
          with zipfile.ZipFile('Orbit-1.0.zip') as package:
              assert set(package.namelist())=={'Orbit-1.0/Companion.exe','Orbit-1.0/OrbitUpdater.exe','Orbit-1.0/LIRE-MOI.md'}
          print('Verified software and signed update catalogs; no widget packages.')
          PY
      - name: Publish version 1.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view build-2026101410 --repo "$GH_REPO" >/dev/null 2>&1; then echo 'Release exists; previous files preserved.'; exit 0; fi
          gh release create build-2026101410 Orbit-1.0.zip orbit-catalog-v2.json orbit-catalog.json --repo "$GH_REPO" --title 'Orbit 1.0' --notes 'Software update button changes to sage green and displays Update available only when a newer Orbit build is detected. White button text and translations in all nine languages. Pearl interface and integrated TRACKR settings retained. Existing modules, libraries and backups unchanged. No .icue or .icuewidget files. Public version 1.0.'
